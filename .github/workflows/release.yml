name: Signed release candidate

# Every main push builds a uniquely versioned candidate. Only the newest
# successful candidate remains as a draft; publishing it triggers LSPosed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'doccstat/pixel-launcher-folder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # setup-android's default also requests the removed legacy "tools" package.
          packages: platform-tools
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Validate build guards
        run: python3 -m unittest discover -s tests/build_tests -v
      - name: Assign a unique candidate version for this commit
        env:
          CANDIDATE_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          path = 'AndroidManifest.xml'
          android = '{http://schemas.android.com/apk/res/android}'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(path)
          root = tree.getroot()
          base_code = int(root.attrib[android + 'versionCode'])
          base_name = root.attrib[android + 'versionName']
          number = int(os.environ['CANDIDATE_NUMBER'])
          code = base_code * 100000 + number
          name = f'{base_name}-build.{number}'
          if code > 2100000000:
              raise ValueError('Candidate versionCode is outside the Android range')
          root.set(android + 'versionCode', str(code))
          root.set(android + 'versionName', name)
          tree.write(path, encoding='utf-8', xml_declaration=True)
          print(f'Candidate version: {code}-{name}')
          PY
      - name: Build with the permanent key and verify the pinned certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE: ${{ runner.temp }}/pixel-launcher-folders-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$SIGNING_KEYSTORE"' EXIT
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode >"$SIGNING_KEYSTORE"
          python3 build.py --release
      - name: Create or refresh the newest signed draft candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version_code=$(python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("AndroidManifest.xml").getroot(); print(r.attrib["{http://schemas.android.com/apk/res/android}versionCode"])')
          version_name=$(python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("AndroidManifest.xml").getroot(); print(r.attrib["{http://schemas.android.com/apk/res/android}versionName"])')
          tag="$version_code-$version_name"
          cat >dist/release-notes.md <<EOF
          ## Pixel Launcher Folders $version_name

          - Adds customizable folders to the Pixel Launcher app drawer.
          - Sorts folder apps and previews alphabetically.
          - Supports user-visible backup and restore.
          - Preserves Android profile identity without modifying installed apps.
          - Uses the native Home and WM Shell activity-drag paths.

          Tested on Pixel 11 Pro Fold, Android 17, Pixel Launcher 17.
          Android 15+ and rooted Pixel Launcher devices are required. Other
          launcher versions are unverified. Home shortcut, split-screen,
          pop-up, and bubble-target dragging remain experimental.

          The APK is signed with the permanent release key; its SHA-256 checksum
          is included with this release.
          EOF
          python3 .github/scripts/refresh-draft.py "$tag" "$version_name" "$GITHUB_SHA"
