name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # setup-android's default also requests the removed legacy "tools" package.
          packages: platform-tools
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Check build and signing tests
        run: python3 -m unittest discover -s tests/build_tests -v
      - name: Compile instrumentation variant (device execution is separate)
        run: python3 build.py --test
      - name: Build development APK without instrumentation
        run: python3 build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-apk-not-for-release
          path: dist/PixelLauncherFolders.apk
          if-no-files-found: error
          retention-days: 7
