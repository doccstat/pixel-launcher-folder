name: Distribute latest release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Serialize with signing so source assets cannot change during verification.
concurrency:
  group: signed-release
  cancel-in-progress: false

env:
  LISTING_REPOSITORY: Xposed-Modules-Repo/com.lixingchi.pixellauncherfolder

jobs:
  distribute:
    if: >-
      github.repository == 'doccstat/pixel-launcher-folder' &&
      ((github.event_name == 'release' && github.event.action == 'published') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Resolve the latest stable source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Always use GitHub Latest, even for delayed events or manual retries.
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          tag=$(jq -r .tag_name <<<"$release_json")
          [[ "$tag" =~ ^[1-9][0-9]*-.+$ ]]
          test "$(jq -r .draft <<<"$release_json")" = false
          test "$(jq -r .prerelease <<<"$release_json")" = false
          printf '%s\n' "$tag" >"$RUNNER_TEMP/release-tag"
          jq -r .name <<<"$release_json" >"$RUNNER_TEMP/release-title"
          jq -r .body <<<"$release_json" >"$RUNNER_TEMP/release-notes.md"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned verification tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Download and verify the exact source APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          tag=$(cat "$RUNNER_TEMP/release-tag")
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'PixelLauncherFolders.apk' \
            --pattern 'PixelLauncherFolders.apk.sha256' --dir "$tmp"
          (cd "$tmp" && sha256sum -c PixelLauncherFolders.apk.sha256)
          expected=$(printf '%s' "$SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::Set ANDROID_SIGNING_CERT_SHA256 in the release environment (64 hex digits; not the APK checksum).'
            exit 1
          fi
          if ! "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            "$tmp/PixelLauncherFolders.apk" >"$tmp/apksigner.txt" 2>&1; then
            cat "$tmp/apksigner.txt"
            exit 1
          fi
          actual=$(awk -F': ' '/^Signer #1 certificate SHA-256 digest:/{print tolower($2)}' \
            "$tmp/apksigner.txt" | tr -d ':[:space:]')
          if [ "$actual" != "$expected" ]; then
            printf '::error::APK certificate mismatch: expected %s; got %s.\n' "$expected" "$actual"
            exit 1
          fi
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$tmp/PixelLauncherFolders.apk")
          package_line=$(grep '^package:' <<<"$badging")
          [[ "$package_line" == *"name='com.lixingchi.pixellauncherfolder'"* ]]
          [[ "$package_line" == *"versionCode='${tag%%-*}'"* ]]
          [[ "$package_line" == *"versionName='${tag#*-}'"* ]]
          mkdir -p "$RUNNER_TEMP/verified-release"
          cp "$tmp/PixelLauncherFolders.apk" "$RUNNER_TEMP/verified-release/PixelLauncherFolders.apk"
          cp "$tmp/PixelLauncherFolders.apk.sha256" "$RUNNER_TEMP/verified-release/PixelLauncherFolders.apk.sha256"
      - name: Create or repair the matching listing release without changing its version
        env:
          GH_TOKEN: ${{ secrets.LSPOSED_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          repo="$LISTING_REPOSITORY"
          tag=$(cat "$RUNNER_TEMP/release-tag")
          listing_releases=$(gh api --paginate --slurp "repos/$repo/releases?per_page=100")
          if jq -e --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | length > 0' <<<"$listing_releases" >/dev/null; then
            gh release upload "$tag" --repo "$repo" --clobber \
              "$RUNNER_TEMP/verified-release/PixelLauncherFolders.apk" \
              "$RUNNER_TEMP/verified-release/PixelLauncherFolders.apk.sha256"
            gh release edit "$tag" --repo "$repo" \
              --title "$(cat "$RUNNER_TEMP/release-title")" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --draft=false --prerelease=false --latest
          else
            gh release create "$tag" --repo "$repo" --title "$(cat "$RUNNER_TEMP/release-title")" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest \
              "$RUNNER_TEMP/verified-release/PixelLauncherFolders.apk" \
              "$RUNNER_TEMP/verified-release/PixelLauncherFolders.apk.sha256"
          fi
